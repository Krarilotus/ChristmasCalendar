door01_story: |
  ## 第 1 扇门

  ![第 1 扇门的地图概览](doors/Door01/Door01_preview.jpg)

  通往《十字军东征》世界的古老大门门轴发出一声刺耳的吱呀声……*这扇门究竟紧闭了多久？*

  你身处一个中世纪奇幻世界，在这里一切都要遵循《要塞：十字军东征》的规则。我们为即将到来的任务拍了一张全景图——看看上面的预览，感受一下眼下局势有多紧迫吧。

  **你的领主从左下角起步，身边带着一支军队**，那是你的好友[**埃米尔**](#color:#0000ff)为你提供的。**你第一眼看到的，就是右侧那座已被夷为平地的城堡**，周围全是你的敌人：[**蛇**](#color:purple)、[**老鼠**](#color:green)以及[**萨拉丁**](#color:#008b8b)。

  [**苏丹**](#color:#b8860b) 正守卫着萨拉丁城堡的北门，而[**治安官**](#color:#000000) 盘踞在地图上方，在一场仰攻战中死死压制着埃米尔。

  现在正是**提前谋划战略**的时候。你的初始部队里包含几名用来围攻敌方城堡的工程师，但你无法建造移动盾牌。

  正如承诺的那样，每张地图都附带了一些提示。不过我建议你只在实在打不过去的时候再偷看：

  [提示 1](#page:door01_hint1) [提示 2](#page:door01_hint2) [提示 3](#page:door01_hint3) [提示 4](#page:door01_hint4) [提示 5](#page:door01_hint5) [提示 6](#page:door01_hint6) [提示 7](#page:door01_hint7)

  **是时候奔赴战场了。祝你玩得开心，好运相伴！**

  作者：Krarilotus
door01_hint1: |
  如果你需要援军去针对某个特定敌人，或者物资捉襟见肘，埃米尔或许就是你该求助的人。
door01_hint2: |
  在人口较少时，只需建造 5 个正面设施就能拿到正面恐惧因子的最高战斗加成。
door01_hint3: |
  工程师不必与他们操纵的攻城器械同归于尽，可以提前撤离并重复利用。
door01_hint4: |
  火焰投掷兵能造成极其恐怖的伤害。我建议你要么别在他们射程内的低地逗留，要么在向城堡进军前先把他们干掉。
door01_hint5: |
  让自己的部队爬上敌人的城墙阶梯、接管他们的防御工事，不仅能为你带来优势，还能同时剥夺敌人的优势。
door01_hint6: |
  塔楼投石机和重型投石机都是围攻大型城堡的利器。重型投石机只要用攻击指令瞄准弩炮塔前方的地面，就能在弩炮塔射程之外将其摧毁。
door01_hint7: |
  击杀敌方领主可以提升你的军队上限，好让你有资本去挑战更强的敌人。
