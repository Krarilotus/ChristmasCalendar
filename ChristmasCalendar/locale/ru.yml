door01_story: |
  ## Дверь 1

  ![Обзор карты двери 1](doors/Door01/Door01_preview.jpg)

  Громкий скрип вырывается из петель этого старого портала в мир Crusader… *как же давно его не открывали?*

  Ты оказался в средневековом фэнтезийном мире, где всё подчиняется правилам Stronghold Crusader. Мы сделали обзорный снимок предстоящей миссии — взгляни на него выше, чтобы оценить всю срочность ситуации.

  **Твой лорд начинает в левом нижнем углу в сопровождении армии**, которую предоставил твой друг [**Эмир**](#color:#0000ff). **Первое, что ты увидишь, — твой разрушенный замок** справа, окружённый врагами: [**Змеёй**](#color:purple), [**Крысой**](#color:green) и [**Саладином**](#color:#008b8b).

  [**Султан**](#color:#b8860b) охраняет северные ворота замка Саладина, а [**Шериф**](#color:#000000) занимает верхнюю часть карты, тесня Эмира в бою на подъёме.

  Самое время **продумать стратегию наперёд**. В твоих стартовых силах есть несколько инженеров для осады вражеского замка, но доступа к переносным щитам у тебя не будет.

  Как и было обещано, к каждой карте прилагаются подсказки. Советую заглядывать в них только в случае совсем уж тяжёлой борьбы:

  [Подсказка 1](#page:door01_hint1) [Подсказка 2](#page:door01_hint2) [Подсказка 3](#page:door01_hint3) [Подсказка 4](#page:door01_hint4) [Подсказка 5](#page:door01_hint5) [Подсказка 6](#page:door01_hint6) [Подсказка 7](#page:door01_hint7)

  **Пора вступать в бой. Весёлой игры и удачи!**

  от Krarilotus
door01_hint1: |
  Если тебе нужно подкрепление против конкретного врага или заканчиваются припасы, Эмир — как раз тот, к кому стоит обратиться за помощью.
door01_hint2: |
  При небольшом населении максимальный боевой бонус от положительного фактора страха достигается уже постройкой 5 хороших вещей.
door01_hint3: |
  Инженеры не обязаны погибать вместе со своим осадным орудием — их можно отвести и использовать повторно.
door01_hint4: |
  Огнеметатели наносят сокрушительный урон. Советую либо не задерживаться в низине в зоне их досягаемости, либо перебить их до штурма замка.
door01_hint5: |
  Захват вражеских укреплений собственными войсками через их лестницы даст тебе преимущество и одновременно лишит его противника.
door01_hint6: |
  Мангонели и требюше — отличные инструменты для осады крупных замков. Требюше способны перестреливать башни с баллистами, если задать им приказ атаки по земле прямо перед башней.
door01_hint7: |
  Убийство лордов увеличивает твой лимит армии, позволяя справиться с более сильными врагами.
