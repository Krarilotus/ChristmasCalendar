door01_story: |
  ## Türchen 1

  ![Übersicht der Karte von Türchen 1](doors/Door01/Door01_preview.jpg)

  Ein lautes Stöhnen entfleucht dem Scharnier des alten Portals in die Welt der Kreuzfahrer… *wie lange hatte sie schon geschlummert?*

  Du findest dich in einer mittelalterlichen Fantasiewelt wieder, in der du dich den Regeln von Stronghold Crusader unterwirfst. Du blickst auf die Übersichtskarte (oben), um dir einen Eindruck über die Dringlichkeit der Situation zu verschaffen.

  **Du startest mit deinem Lord in der linken unteren Ecke, begleitet von einer Armee,** welche dir von deinem Freund [**Emir**](#color:#0000ff) zur Verfügung gestellt wurde. **Deine Startansicht fokussiert deine Burg,** oder eher das, was die Schlange nach dem Schleifen deines Bergfriedes davon übrig ließ... diese ist von Feinden umzingelt: Der [**Schlange**](#color:purple), der [**Ratte**](#color:#008000) und [**Saladin**](#color:#008b8b).

  [**Sultan**](#color:#b8860b) verteidigt das nördliche Tor von Saladins Burg, während [**Sheriff**](#color:#000000) die obere Karte vereinnahmt und Emir in einem Kampf bergaufwärts unter Druck setzt.

  **Plant eure Strategie weise voraus**, denn gleich geht es zur Sache! Eure Streitmacht enthält einige Baumeister zur Belagerung einer Burg, allerdings sind diese nicht in der Lage Schilde zu bauen.

  Wie versprochen gibt es ein paar Hinweise zur Karte. Allerdings solltet ihr nur lunzen, wenn ihr es WIRKLICH nötig habt, wo bleibt sonst der Spaß des Knobelns?

  [Hinweis 1](#page:door01_hint1) [Hinweis 2](#page:door01_hint2) [Hinweis 3](#page:door01_hint3) [Hinweis 4](#page:door01_hint4) [Hinweis 5](#page:door01_hint5) [Hinweis 6](#page:door01_hint6) [Hinweis 7](#page:door01_hint7)

  **Es ist Zeit für den Kampf. Viel Glück und viel Spaß!**

  von Krarilotus
door01_hint1: |
  Falls du Verstärkung brauchst oder knapp bei Kasse bist, frage doch einfach Emir, auf ihn ist Verlass!
door01_hint2: |
  Für eine kleine Bevölkerung, kannst du den maximalen Kampfbonus bereits mit 5 positiven Dingen erreichen.
door01_hint3: |
  Baumeister müssen nicht mit ihren Belagerungsgeräten untergehen und können vor deren Tod das Gerät verlassen um ein weiteres zu konstruieren.
door01_hint4: |
  Feuerwerfer töten in engen Gassen Nahkampfeinheiten zuverlässig. Schaltet sie schnell aus oder bringt euch auf Mauern in Sicherheit.
door01_hint5: |
  Die Kontrolle über gegnerische Verteidigungsanlagen zu übernehmen gibt euch selbst den Vorteil, der gleichzeitig den Gegnern abhanden kommt!
door01_hint6: |
  Triböcke eignen sich großartig um Burgen zu belagern, sie können sogar zuverlässig Ballisten Türme zermürben ohne selbst in deren Reichweite zu sein.
door01_hint7: |
  Tötet erst kleinere Gegner, sodass ihr eure mögliche Armeegröße erweitert um auch die dicken Fische zu erlegen.
