door01_story: |
  ## در 1

  ![نمای کلی نقشهٔ در 1](doors/Door01/Door01_preview.jpg)

  صدای جیرجیر بلندی از لولای این دروازهٔ قدیمی به دنیای جنگ‌های صلیبی برمی‌خیزد… *چند وقت است که این در بسته مانده؟*

  شما در دنیایی قرون‌وسطایی و خیالی هستید که در آن قواعد Stronghold Crusader حاکم است. نمایی کلی از مأموریت پیشِ رو تهیه کرده‌ایم؛ برای درک فوریت اوضاع، به تصویر بالا نگاهی بیندازید.

  **لرد شما در گوشهٔ پایین سمت چپ همراه با سپاهی شروع می‌کند** که دوستتان [**امیر**](#color:#0000ff) در اختیارتان گذاشته است. **نخستین چیزی که می‌بینید قلعهٔ ویران‌شدهٔ خودتان است** در سمت راست که دشمنانتان محاصره‌اش کرده‌اند: [**مار**](#color:purple)، [**موش**](#color:green) و [**صلاح‌الدین**](#color:#008b8b).

  [**سلطان**](#color:#b8860b) از دروازهٔ شمالی قلعهٔ صلاح‌الدین محافظت می‌کند، در حالی که [**کلانتر**](#color:#000000) بخش بالایی نقشه را در اختیار گرفته و امیر را در نبردی سربالایی تحت فشار گذاشته است.

  اکنون وقت آن است که **راهبرد خود را از پیش برنامه‌ریزی کنید**. نیروهای اولیهٔ شما شامل چند مهندس برای محاصرهٔ قلعهٔ دشمن است، اما به سپرهای متحرک دسترسی نخواهید داشت.

  طبق قولمان، همراه هر نقشه چند راهنمایی هم هست. پیشنهاد می‌کنم فقط وقتی واقعاً گیر افتادید سراغشان بروید:

  [راهنمایی 1](#page:door01_hint1) [راهنمایی 2](#page:door01_hint2) [راهنمایی 3](#page:door01_hint3) [راهنمایی 4](#page:door01_hint4) [راهنمایی 5](#page:door01_hint5) [راهنمایی 6](#page:door01_hint6) [راهنمایی 7](#page:door01_hint7)

  **وقت رفتن به میدان نبرد است. خوش بگذرد و موفق باشید!**

  اثر Krarilotus
door01_hint1: |
  اگر برای حمله به دشمنی خاص به نیروی کمکی نیاز دارید یا منابع‌تان رو به اتمام است، امیر شاید بهترین کسی باشد که می‌توانید از او کمک بخواهید.
door01_hint2: |
  برای جمعیتی کوچک، بیشترین پاداش نبرد از عامل ترس مثبت همین حالا با ساختن ۵ مورد مثبت به دست می‌آید.
door01_hint3: |
  مهندسان مجبور نیستند همراه ادوات محاصره‌ای که هدایت می‌کنند بمیرند و می‌توان دوباره از آن‌ها استفاده کرد.
door01_hint4: |
  آتش‌اندازان آسیب بسیار سنگینی وارد می‌کنند. توصیه می‌کنم یا در زمین‌های پست در برد آن‌ها نمانید، یا پیش از یورش به قلعه کارشان را بسازید.
door01_hint5: |
  بالا رفتن از پله‌های دیوار دشمن و تصرف سازه‌های دفاعی‌اش با نیروهای خودتان، هم به شما برتری می‌دهد و هم آن برتری را از دشمن می‌گیرد.
door01_hint6: |
  منجنیق‌های برجی و تریبوشت‌ها ابزارهای عالی برای محاصرهٔ قلعه‌های بزرگ هستند. تریبوشت‌ها می‌توانند با دستور حمله به زمین درست جلوی برج‌های بالیستا، خارج از برد آن‌ها شلیک کنند.
door01_hint7: |
  کشتن لردها سقف ارتش شما را افزایش می‌دهد تا بتوانید به سراغ دشمنان قوی‌تر بروید.
