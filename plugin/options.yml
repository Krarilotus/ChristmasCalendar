meta:
  version: 1.0.0
options:
- display: GroupBox
  name: calendar
  header: '{{calendar}}'
  text: '{{calendar_descr}}'
  hasHeader: true
  category: ['{{category}}']
  children:
  - url: ChristmasCalendar.doors
    name: doors
    header: '{{doors}}'
    text: '{{doors_descr}}'
    hasHeader: true
    display: CustomMenu
    contents:
      type: custom
      source:
        html: doors.html
        css: doors.css
        js: doors.js
  - url: ChristmasCalendar.map-language
    name: map-language
    header: '{{map_language}}'
    text: '{{map_language_descr}}'
    display: Choice
    contents:
      choices:
      - name: en
        text: '{{map_language_en}}'
      - name: de
        text: '{{map_language_de}}'
      value: en
